function t(s){
  if(!s) return s;
  if(S_lang==="fr") return s;
  var d = DICT[s];
  return (d && d[S_lang]) || s;
}
function translateNode(node){
  if(node.nodeType===3){
    var raw = node.nodeValue, trimmed = raw.trim();
    if(!trimmed) return;
    var d = DICT[trimmed];
    if(d && d[S_lang]){ node.nodeValue = raw.replace(trimmed, d[S_lang]); return; }
    /* motifs composites courants : "Cycle N · Jour M", dates, badges numériques */
    var m;
    if((m = trimmed.match(/^Cycle\s+(\d+)\s*·\s*Jour\s+(\d+)(\/\d+)?$/))){
      node.nodeValue = raw.replace(trimmed, t("Cycle")+" "+m[1]+" · "+t("Jour")+" "+m[2]+(m[3]||""));
      return;
    }
    if((m = trimmed.match(/^(\d+)\s+jours?$/))){
      node.nodeValue = raw.replace(trimmed, m[1]+" "+(S_lang==="en"?"days":"días"));
      return;
    }
  } else if(node.nodeType===1){
    if(node.hasAttribute && node.hasAttribute("placeholder")){
      var ph = node.getAttribute("placeholder"), pd = DICT[ph];
      if(pd && pd[S_lang]) node.setAttribute("placeholder", pd[S_lang]);
    }
    for(var i=0;i<node.childNodes.length;i++){ translateNode(node.childNodes[i]); }
  }
}
function applyI18nStatic(){
  if(S_lang==="fr") return;
  translateNode(document.body);
  try{
    var mo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){ translateNode(n); });
      });
    });
    mo.observe(document.body, {childList:true, subtree:true, characterData:false});
  }catch(e){}
}

};

========================================================= */
function autoAdvanceCycleDay(){
  var last = new Date(S.lastOpenDate+"T00:00:00");
  var now = new Date(todayKey()+"T00:00:00");
  var diffDays = Math.round((now-last)/86400000);
  if(diffDays>0){
    for(var i=0;i<diffDays;i++){
      S.cycleDay++;
      if(S.cycleDay>90){ S.cycleDay=1; S.cycleNum++; }
    }
    S.lastOpenDate = todayKey();
    save1("cycleDay"); save1("cycleNum"); save1("lastOpenDate");
  }
}
function scheduleMidnightReload(){
  var now = new Date();
  var next = new Date(now.getFullYear(),now.getMonth(),now.getDate(),DAY_CUTOFF_HOUR,0,5,0);
  if(next<=now){ next.setDate(next.getDate()+1); }
  setTimeout(function(){ location.reload(); }, next-now);
}

/* ---------- Calculs charge / RPE / 1RM / surcharge progressive / deload ---------- */
var DELOAD_FACTOR = 0.6; /* -40% de charge pendant la semaine de deload */
var PROGRESSION_INCREMENT = 2.5; /* +2.5kg quand le haut de la fourchette de reps est atteint */
function calcORM(kg, reps){
  /* Estimation du 1RM (formule d'Epley) */
  if(!kg || !reps || reps<=0) return null;
  return reps===1 ? Math.round(kg) : Math.round(kg*(1+reps/30));
}
function parseTargetReps(repsStr){
  if(!repsStr) return null;
  var nums = String(repsStr).match(/\d+/g);
  if(!nums) return null;
  return parseInt(nums[nums.length-1]);
}
function getLastLoggedSets(key, excludeDate){
  var dates = Object.keys(S.exerciseSets).filter(function(d){ return d!==excludeDate; }).sort().reverse();
  for(var i=0;i<dates.length;i++){
    var sets = toSetsArray(S.exerciseSets[dates[i]][key]).filter(function(s){ return s && s.weight!=null && s.reps!=null; });
    if(sets.length) return {date:dates[i], sets:sets};
  }
  return null;
}
function getBestEverORM(key){
  var best = null;
  Object.keys(S.exerciseSets).forEach(function(date){
    toSetsArray(S.exerciseSets[date][key]).forEach(function(s){
      if(!s || s.weight==null || s.reps==null) return;
      var orm = calcORM(s.weight, s.reps);
      if(orm && (best==null || orm>best)) best = orm;
    });
  });
  return best;
}
function getSuggestedWeight(key, exo, isDeload){
  var last = getLastLoggedSets(key, todayKey());
  if(!last) return null;
  var maxSet = last.sets.reduce(function(a,b){ return (b.weight>a.weight)?b:a; });
  var lastKg = maxSet.weight, lastReps = maxSet.reps;
  var targetReps = parseTargetReps(exo.reps);
  var progressive = !!(targetReps && lastReps>=targetReps);
  var suggested = progressive ? (lastKg + PROGRESSION_INCREMENT) : lastKg;
  var base = suggested;
  if(isDeload){ suggested = Math.round(suggested*DELOAD_FACTOR*2)/2; }
  return {value:suggested, base:base, progressive:progressive, lastKg:lastKg, lastReps:lastReps, isDeload:!!isDeload};
}

function askText(title, placeholder, onSubmit){
  var html = "<div class='modal-hd'><h2>"+title+"</h2><button class='modal-close' onclick=\"closeModal('mdPrompt')\">×</button></div>"+
    "<label class='field'><input type='text' id='askTextInput' placeholder='"+(placeholder||"")+"' autofocus></label>"+
    "<div class='row'><button class='btn ghost grow' id='askTextCancel'>Annuler</button><button class='btn primary grow' id='askTextOk'>Valider</button></div>";

/* =========================================================
   6. CHARTS — canvas 2D vanilla
========================================================= */
var charts = {
  cssColor:function(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#0fa86a";
  },
  drawLine:function(canvas, values, colorVarName, labels){
    if(typeof canvas==="string") canvas = document.getElementById(canvas);
    if(!canvas) return;
    var dpr = window.devicePixelRatio||1;
    var w = canvas.clientWidth||300, h = canvas.clientHeight||140;
    canvas.width = w*dpr; canvas.height = h*dpr;
    var ctx = canvas.getContext && canvas.getContext("2d");
    if(!ctx) return;
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    if(!values || values.filter(function(v){return v!=null;}).length<2){
      ctx.fillStyle = charts.cssColor("--text-dim");
      ctx.font = "11px JetBrains Mono, monospace";
      ctx.fillText("Pas assez de données", 8, h/2);
      return;
    }
    var vals = values.filter(function(v){return v!=null;});
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min-=1; max+=1; }
    var pad = 20;
    var color = charts.cssColor(colorVarName||"--em");
    // grille légère
    ctx.strokeStyle = "rgba(255,255,255,.06)";
    ctx.lineWidth = 1;
    for(var g=0; g<=3; g++){
      var gy = pad + (h-2*pad)*g/3;
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    }
    ctx.beginPath();
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    values.forEach(function(v,i){
      if(v==null) return;
      var x = pad/2 + (w-pad)*i/(values.length-1);
      var y = h - pad - (h-2*pad)*(v-min)/(max-min);
      if(i===0 || values[i-1]==null) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    values.forEach(function(v,i){
      if(v==null) return;
      var x = pad/2 + (w-pad)*i/(values.length-1);
      var y = h - pad - (h-2*pad)*(v-min)/(max-min);
      ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fillStyle=color; ctx.fill();
    });
    ctx.fillStyle = charts.cssColor("--text-dim");
    ctx.font = "9px JetBrains Mono, monospace";
    ctx.fillText(max.toFixed(1), 2, pad-6);
    ctx.fillText(min.toFixed(1), 2, h-4);
  }
};

    CURRENT_SUB[section]=sub;
    var container = $("#sec-"+section);
    $all(".sub-btn", container).forEach(function(b){ b.classList.toggle("active", b.dataset.sub===sub); });
    $all(".subsec", container).forEach(function(s){ s.classList.toggle("active", s.id==="sub-"+section+"-"+sub); });

function calcTargetCalories(){
  var isRefeed = S.goal==="CUT" && REFEED_DAYS.indexOf(S.cycleDay)>-1;
  if(S.goal==="CUT") return isRefeed ? Math.round(S.tdee*1.15) : Math.round(S.tdee - S.deficit);
  if(S.goal==="BULK") return Math.round(S.tdee + S.surplus);
  return Math.round(S.tdee);
}

function autoCheckSkinHabit(){
  var tk = todayKey();
  var cycle = skinCycleFor(effectiveNow().getDay());
  var td = S.skin[tk] || {};
  var allItems = cycle.morning.concat(cycle.evening);
  var allDone = allItems.every(function(item){ return !!td[item.label]; });
  if(!S.habits[tk]) S.habits[tk]={};
  var wasDone = !!S.habits[tk]["skincare"];
  S.habits[tk]["skincare"] = allDone;
  if(allDone && !wasDone){ S.habitStreaks["skincare"] = (S.habitStreaks["skincare"]||0)+1; }
  else if(!allDone && wasDone){ S.habitStreaks["skincare"] = Math.max(0,(S.habitStreaks["skincare"]||0)-1); }
  save1("habits"); save1("habitStreaks");
}

}

function renderExerciseProgram(sessKey, container){
  var data = SESSION_DATA[sessKey];
  var tk = todayKey();

  function block(title, innerHtml){
    if(sessionFilter==="gym" && (title.indexOf("Warm")>-1 || title.indexOf("Stretch")>-1 || title.indexOf("Mobility")>-1)) return "";
    if(sessionFilter==="mobilite" && !(title.indexOf("Warm")>-1 || title.indexOf("Stretch")>-1 || title.indexOf("Mobility")>-1)) return "";
    return "<div class='card'><div class='card-hd'><h3>"+title+"</h3></div>"+innerHtml+"</div>";
  }

  var out = "";
  if(data.warmup){
    out += block("Warm Up", "<div class='label' style='margin-bottom:6px'>"+data.warmup.sets+" sets</div><ul style='padding-left:16px;font-size:13px;color:var(--text-mid)'>"+
      data.warmup.items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>");
  }
  if(data.holds){
    var hh = data.holds.map(function(h){ return "<div class='row' style='justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)'><span>"+h.name+"</span><span class='mono' style='color:var(--text-dim)'>"+h.sets+"x "+h.reps+"</span></div>"; }).join("");
    out += block("Holds", hh);
  }
  if(data.workout){
    var wh = "";
    var isDeloadW = DELOAD_WEEK.indexOf(S.cycleDay)>-1;
    data.workout.forEach(function(exo, idx){
      wh += renderExerciseCard(sessKey, idx, exo, isDeloadW);
    });
    out += block("Workout", wh);
  }
  if(data.extra){
    var eh = data.extra.map(function(h){ return "<div class='row' style='justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)'><span>"+h.name+"</span><span class='mono' style='color:var(--text-dim)'>"+h.sets+"x "+h.reps+"</span></div>"; }).join("");
    out += block("Complément", eh);
  }
  if(data.supersets){
    var sh = data.supersets.map(function(ss){ return "<div class='label' style='margin-bottom:6px'>"+ss.sets+" super sets</div><ul style='padding-left:16px;font-size:13px;color:var(--text-mid)'>"+ss.items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>"; }).join("");
    out += block("Rotator cuffs & Avant-bras", sh);
  }
  if(data.core){
    var ch = data.core.map(function(c){ return "<div class='label' style='margin-bottom:6px'>"+c.sets+" sets</div><ul style='padding-left:16px;font-size:13px;color:var(--text-mid)'>"+c.items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>"; }).join("");
    out += block("Gainage", ch);
  }
  if(data.stretching){
    data.stretching.forEach(function(st){
      var sh = "<div class='label' style='margin-bottom:6px'>"+st.supersets+" super sets</div><ul style='padding-left:16px;font-size:13px;color:var(--text-mid)'>"+st.items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>";
      out += block(st.title, sh);
    });
  }

  out += "<div class='timer-box'><div class='timer-num' id='restTimerNum'>90</div><div class='row grow'>"+
    "<button class='btn small' id='timerStart'>Démarrer</button>"+
    "<button class='btn small' id='timerReset'>Reset</button>"+
    "<select id='timerPreset' style='width:auto;margin-left:auto'><option value='60'>60s</option><option value='90' selected>90s</option><option value='120'>120s</option><option value='180'>180s</option></select>"+
    "</div></div>";

  out += "<button class='btn primary block' id='btnCompleteSession'>Marquer la séance comme complétée</button>";

  container.insertAdjacentHTML("beforeend", out);

  // exercise interactions
  var isDeloadBind = DELOAD_WEEK.indexOf(S.cycleDay)>-1;
  data.workout && data.workout.forEach(function(exo, idx){ bindExerciseCard(sessKey, idx, exo, isDeloadBind); });

  // timer
  bindRestTimer();

  $("#btnCompleteSession").addEventListener("click", function(){ logCompletedSession(sessKey); });
}

function renderExerciseCard(sessKey, idx, exo, isDeload){
  var name = getExerciseDisplayName(sessKey, idx, exo.name);
  var swapList = getSwapList(exo.swap);
  var coach = COACH_DB[name] || "Amplitude maximale, contrôle la descente, respire.";
  var key = sessKey+"_"+idx;
  var tk = todayKey();
  var loggedSets = toSetsArray(S.exerciseSets[tk] && S.exerciseSets[tk][key]);
  var sugg = getSuggestedWeight(key, exo, isDeload);

  var html = "<div class='hr' style='margin:10px 0'></div><div class='card-hd' style='margin-bottom:4px'>"+
    "<h3 style='font-size:16px'>"+name+"</h3>"+
    (swapList ? "<button class='btn small ghost' data-swapbtn='"+key+"'>changer</button>" : "")+
    "</div>";
  html += "<div class='label'>"+exo.sets+" sets × "+exo.reps+" reps"+(exo.rpe?" · RPE "+exo.rpe:"")+"</div>";
  html += "<select class='inline-swap' data-swapsel='"+key+"' style='display:none;margin:6px 0'>"+
    (swapList||[]).map(function(n){return "<option value='"+n+"' "+(n===name?"selected":"")+">"+n+"</option>";}).join("")+
    "</select>";
  html += "<div class='tag-coach' data-coach='"+key+"'>"+coach+"</div>";

  if(sugg){
    if(sugg.isDeload){
      html += "<div class='badge' style='color:var(--c-deload);border-color:var(--c-deload);margin-top:6px'>"+
        "Deload : "+sugg.value+"kg conseillés (-40% vs "+sugg.base+"kg)</div>";
    } else if(sugg.progressive){
      html += "<div class='badge em' style='margin-top:6px'>💪 Charge conseillée : "+sugg.value+"kg (+"+PROGRESSION_INCREMENT+"kg, dernière fois "+sugg.lastKg+"kg×"+sugg.lastReps+")</div>";
    } else {
      html += "<div class='badge' style='margin-top:6px'>Charge conseillée : "+sugg.value+"kg (identique, dernière fois "+sugg.lastKg+"kg×"+sugg.lastReps+")</div>";
    }
  }

  html += "<div id='setsWrap_"+key+"' style='margin-top:8px'>";
  for(var s=0;s<exo.sets;s++){
    var v = loggedSets[s]||{};
    var orm = (v.weight!=null && v.reps!=null) ? calcORM(v.weight, v.reps) : null;
    html += "<div class='set-row'><div class='idx'>"+(s+1)+"</div>"+
      "<input type='number' placeholder='reps' data-setinput='"+key+"_"+s+"_reps' value='"+(v.reps!=null?v.reps:"")+"'>"+
      "<input type='number' placeholder='"+(sugg?sugg.value:"kg")+"' data-setinput='"+key+"_"+s+"_weight' value='"+(v.weight!=null?v.weight:"")+"'>"+
      "<span class='mono' id='orm_"+key+"_"+s+"' style='font-size:10px;color:var(--go);min-width:52px;text-align:right'>"+(orm?"~"+orm+"kg 1RM":"")+"</span>"+
      "<span class='mono' style='font-size:10px;color:"+(v.done?"var(--em)":"var(--text-dim)")+"'>"+(v.done?"✓":"")+"</span></div>";
  }
  html += "</div>";
  return html;
}
function updateORMBadge(key, s){
  var repsInp = $("[data-setinput='"+key+"_"+s+"_reps']");
  var kgInp = $("[data-setinput='"+key+"_"+s+"_weight']");
  var badge = $("#orm_"+key+"_"+s);
  if(!repsInp || !kgInp || !badge) return;
  var orm = calcORM(parseFloat(kgInp.value)||null, parseFloat(repsInp.value)||null);
  badge.textContent = orm ? "~"+orm+"kg 1RM" : "";
}
function bindExerciseCard(sessKey, idx, exo, isDeload){
  var key = sessKey+"_"+idx;
  var tk = todayKey();
  var swapBtn = $("[data-swapbtn='"+key+"']");
  var swapSel = $("[data-swapsel='"+key+"']");
  if(swapBtn){
    swapBtn.addEventListener("click", function(){ swapSel.style.display = swapSel.style.display==="none"?"block":"none"; });
  }
  if(swapSel){
    swapSel.addEventListener("change", function(){
      var newName = this.value;
      setExerciseSwap(sessKey, idx, newName);
      renderSessionToday();
    });
  }
  $all("[data-setinput^='"+key+"_']").forEach(function(inp){
    inp.addEventListener("input", function(){
      var parts = inp.dataset.setinput.split("_");
      var setIdx = parts[parts.length-2];
      updateORMBadge(key, setIdx);
    });
    inp.addEventListener("change", function(){
      var parts = inp.dataset.setinput.split("_");
      var setIdx = parseInt(parts[parts.length-2]);
      var field = parts[parts.length-1];
      if(!S.exerciseSets[tk]) S.exerciseSets[tk]={};
      if(!S.exerciseSets[tk][key]) S.exerciseSets[tk][key]=[];
      if(!S.exerciseSets[tk][key][setIdx]) S.exerciseSets[tk][key][setIdx]={};
      S.exerciseSets[tk][key][setIdx][field] = parseFloat(inp.value)||null;
      S.exerciseSets[tk][key][setIdx].done = true;
      S.exerciseSets[tk][key][setIdx].name = getExerciseDisplayName(sessKey, idx, exo.name);
      save1("exerciseSets");
      updateORMBadge(key, setIdx);
    });
  });
}

var timerInterval=null, timerRemaining=90;
function bindRestTimer(){
  var num = $("#restTimerNum"), start=$("#timerStart"), reset=$("#timerReset"), preset=$("#timerPreset");
  timerRemaining = parseInt(preset.value);
  num.textContent = timerRemaining;
  preset.addEventListener("change", function(){ clearInterval(timerInterval); timerRemaining=parseInt(preset.value); num.textContent=timerRemaining; start.textContent="Démarrer"; });
  start.addEventListener("click", function(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; start.textContent="Reprendre"; return; }
    start.textContent="Pause";
    timerInterval = setInterval(function(){
      timerRemaining--;
      num.textContent = Math.max(0,timerRemaining);
      if(timerRemaining<=0){ clearInterval(timerInterval); timerInterval=null; start.textContent="Démarrer"; toast("⏱ Repos terminé !"); if(navigator.vibrate) navigator.vibrate(200); }
    },1000);
  });
  reset.addEventListener("click", function(){
    clearInterval(timerInterval); timerInterval=null;
    timerRemaining = parseInt(preset.value); num.textContent=timerRemaining; start.textContent="Démarrer";
  });
}

function logCompletedSession(sessKey, dateOverride){
  var tk = dateOverride || todayKey();
  var type = sessTypeOfKey(sessKey);
  var extraLabels = {straps:"Straps", pole:"Pole"};
  if(!S.sessions[tk]) S.sessions[tk]=[];
  if(S.sessions[tk].indexOf(sessKey)===-1) S.sessions[tk].push(sessKey);
  var entry = {date:tk, sessKey:sessKey, type:type, label:(SESSION_META[sessKey]?SESSION_META[sessKey].label:(extraLabels[sessKey]||sessKey)), cycleDay:S.cycleDay, cycleNum:S.cycleNum};
  S.history = S.history.filter(function(h){ return !(h.date===tk && h.sessKey===sessKey); });
  S.history.push(entry);
  save1("sessions"); save1("history");
  toast("Séance "+entry.label+" enregistrée ✓");
  renderSessionHistory();
}

  function drawExosForSession(sessKey){

    }
    var html2 = "";
    data.workout.forEach(function(exo, idx){

      html2 += "<div class='card' style='margin-top:8px'><div class='label' style='margin-bottom:6px'>"+exo.name+" — "+exo.sets+"x "+exo.reps+"</div>";
      if(swapList){
        html2 += "<select class='inline-swap' data-retroswap='"+idx+"' style='margin-bottom:8px;display:block'>"+
          swapList.map(function(n){return "<option value='"+n+"' "+(n===exo.name?"selected":"")+">"+n+"</option>";}).join("")+"</select>";
      }
      for(var s=0;s<exo.sets;s++){
        html2 += "<div class='set-row'><div class='idx'>"+(s+1)+"</div>"+
          "<input type='number' placeholder='reps' data-retroset='"+idx+"_"+s+"_reps'>"+
          "<input type='number' placeholder='kg (option.)' data-retroset='"+idx+"_"+s+"_weight'>"+
          "<span></span></div>";
      }
      html2 += "</div>";
    });
    wrap.innerHTML = html2;
  }

  $("#retroSession").addEventListener("change", function(){ drawExosForSession(this.value); });
  drawExosForSession($("#retroSession").value);

  $("#retroSave").addEventListener("click", function(){
    var d = $("#retroDate").value;
    var sessKey = $("#retroSession").value;
    var data = SESSION_DATA[sessKey];
    if(data && data.workout){
      data.workout.forEach(function(exo, idx){
        var swapSel = $("[data-retroswap='"+idx+"']");
        var name = swapSel ? swapSel.value : exo.name;
        var key = sessKey+"_"+idx;
        for(var s=0;s<exo.sets;s++){
          var repsInp = $("[data-retroset='"+idx+"_"+s+"_reps']");
          var weightInp = $("[data-retroset='"+idx+"_"+s+"_weight']");
          var reps = repsInp && repsInp.value ? parseFloat(repsInp.value) : null;
          var weight = weightInp && weightInp.value ? parseFloat(weightInp.value) : null;

            if(!S.exerciseSets[d][key]) S.exerciseSets[d][key]=[];

          }
        }
      });
      save1("exerciseSets");
    }
    logCompletedSession(sessKey, d);
    closeModal("mdRetro");
  });
  openModal("mdRetro");
}

/* ---------- PROGRESSION ---------- */
function renderSessionProgress(){
  var container = $("#sub-session-progress");
  var allExos = {};
  Object.keys(S.exerciseSets).forEach(function(date){
    Object.keys(S.exerciseSets[date]).forEach(function(key){
      toSetsArray(S.exerciseSets[date][key]).forEach(function(s){
        if(!s || !s.name) return;
        allExos[s.name]=true;
      });
    });
  });
  var names = Object.keys(allExos).sort();
  var html = "<div class='card'><div class='label' style='margin-bottom:8px'>"+t("Choisir un exercice")+"</div>"+
    "<select id='progExoSelect'>"+(names.length?names.map(function(n){return "<option>"+n+"</option>";}).join(""):"<option>"+t("Aucune donnée")+"</option>")+"</select>"+
    "<div id='progOrmBadge' class='badge em' style='margin-top:8px'></div>"+
    "<canvas id='progCanvas' height='160' style='margin-top:12px'></canvas>"+
    "<div class='label' style='margin-top:6px'>"+t("Charge max (kg) par séance loggée")+"</div></div>";
  container.innerHTML = html;
  if(!names.length) return;
  function draw(){
    var exo = $("#progExoSelect").value;
    var dates = Object.keys(S.exerciseSets).sort();
    var values = [];
    var bestOrm = null;
    dates.forEach(function(date){
      var maxW = null;
      Object.keys(S.exerciseSets[date]).forEach(function(key){
        toSetsArray(S.exerciseSets[date][key]).forEach(function(s){
          if(s && s.name===exo && s.weight!=null){ maxW = maxW==null? s.weight : Math.max(maxW,s.weight); }
          if(s && s.name===exo && s.weight!=null && s.reps!=null){
            var orm = calcORM(s.weight, s.reps);
            if(orm && (bestOrm==null || orm>bestOrm)) bestOrm = orm;
          }
        });
      });
      if(maxW!=null) values.push(maxW);
    });
    $("#progOrmBadge").textContent = bestOrm ? ("1RM estimé (record) : ~"+bestOrm+"kg") : "Pas encore de charge/reps loggées pour estimer le 1RM";
    charts.drawLine("progCanvas", values, "--em");
  }
  $("#progExoSelect").addEventListener("change", draw);
  draw();
}

    "<div class='cal-grid' id='calGrid'></div>"+
    "<div class='cal-legend'>"+
    ["cali","gym","muaythai","accessory","straps-pole","piscine"].map(function(t){
      var labels={cali:"CALISTHÉNIE",gym:"GYM",muaythai:"MUAY THAÏ",accessory:"ACCESSORY","straps-pole":"STRAPS ET POLE DANCE",piscine:"PISCINE"};
      var vars={cali:"--c-cali",gym:"--c-gym",muaythai:"--c-muaythai",accessory:"--c-accessory","straps-pole":"--c-straps-pole",piscine:"--c-piscine"};
      return "<div class='li'><span class='dot' style='background:var("+vars[t]+")'></span>"+labels[t]+"</div>";

function drawCalendar(){
  var months=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  $("#calLabel").textContent = months[histCalMonth]+" "+histCalYear;
  var grid = $("#calGrid");
  grid.innerHTML = "";
  ["L","M","M","J","V","S","D"].forEach(function(d){ grid.appendChild(el("div","cal-dow",d)); });
  var first = new Date(histCalYear, histCalMonth, 1);
  var startDow = (first.getDay()+6)%7; // lundi=0
  for(var i=0;i<startDow;i++) grid.appendChild(el("div","cal-cell empty"));
  var daysInMonth = new Date(histCalYear, histCalMonth+1, 0).getDate();
  var byDate = {};
  S.history.forEach(function(h){ if(!byDate[h.date]) byDate[h.date]=[]; byDate[h.date].push(h); });
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = histCalYear+"-"+String(histCalMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var cell = el("div","cal-cell");
    var entries = byDate[dateStr];
    if(entries && entries.length){
      var type = entries[0].type;
      cell.classList.add(typeColorClass(type));
      cell.title = entries.map(function(e){return e.label;}).join(", ");
      if(entries.length>1) cell.style.borderStyle="double";

    cell.addEventListener("click", function(dateStr, entries){
      return function(){ if(entries) showHistDetail(dateStr, entries); };
    }(dateStr, entries));
    grid.appendChild(cell);

var nutri = {
  getTodayMacros:function(){ return this.getMacrosFor(todayKey()); },
  getMacrosFor:function(dateKey){
    var list = S.meals[dateKey]||[];
    var out = {kcal:0,p:0,g:0,l:0};
    list.forEach(function(m){ out.kcal+=m.kcal||0; out.p+=m.p||0; out.g+=m.g||0; out.l+=m.l||0; });
    return out;
  },
  computeTDEE:function(){
    var bmr = 10*S.weight + 6.25*FIXED_HEIGHT - 5*ageFromBday() + (FIXED_SEX==="F"? -161 : 5);
    return Math.round(bmr * S.activity);
  }
};

  html += "<button class='btn primary block' id='mpAssignSave'>Enregistrer</button>";
  $("#mdMealPrepAssignBody").innerHTML = html;
  $("#mpAssignSave").addEventListener("click", function(){
    S.mealPlan[key] = $("#mpAssignVal").value;
    save1("mealPlan");
    closeModal("mdMealPrepAssign");
    renderMealPrep();
  });
  openModal("mdMealPrepAssign");
}

/* ---------- RECETTES ---------- */
function renderRecipes(){
  var container = $("#sub-nutri-recipes");
  var html = "<button class='btn primary block' id='btnNewRecipe' style='margin-bottom:10px'>+ Nouvelle recette</button>";
  if(!S.recipes.length) html += "<div class='empty-state'>Aucune recette enregistrée.</div>";
  S.recipes.forEach(function(r,i){
    html += "<div class='card'><div class='card-hd'><h3 style='font-size:16px'>"+r.name+"</h3><button class='btn small ghost' data-delrecipe='"+i+"'>×</button></div>"+
      "<div class='label'>"+r.kcal+" kcal · P"+r.p+" G"+r.g+" L"+r.l+"</div>"+
      "<p style='font-size:12px;color:var(--text-mid);margin-top:6px;white-space:pre-line'>"+(r.notes||"")+"</p></div>";
  });
  container.innerHTML = html;
  $("#btnNewRecipe").addEventListener("click", openRecipeModal);
  $all("[data-delrecipe]", container).forEach(function(b){
    b.addEventListener("click", function(){ S.recipes.splice(parseInt(b.dataset.delrecipe),1); save1("recipes"); renderRecipes(); });
  });
}
function openRecipeModal(){
  var html = "<div class='modal-hd'><h2>Nouvelle recette</h2><button class='modal-close' onclick=\"closeModal('mdRecipe')\">×</button></div>"+
    "<label class='field'><div class='label'>Nom</div><input type='text' id='rcName'></label>"+
    "<div class='row'><label class='field grow'><div class='label'>Kcal</div><input type='number' id='rcKcal'></label>"+
    "<label class='field grow'><div class='label'>P</div><input type='number' id='rcP'></label>"+
    "<label class='field grow'><div class='label'>G</div><input type='number' id='rcG'></label>"+
    "<label class='field grow'><div class='label'>L</div><input type='number' id='rcL'></label></div>"+
    "<label class='field'><div class='label'>Ingrédients / préparation</div><textarea id='rcNotes' rows='4'></textarea></label>"+
    "<button class='btn primary block' id='rcSave'>Enregistrer</button>";
  $("#mdRecipeBody").innerHTML = html;
  $("#rcSave").addEventListener("click", function(){
    S.recipes.push({name:$("#rcName").value||"Recette", kcal:parseFloat($("#rcKcal").value)||0, p:parseFloat($("#rcP").value)||0, g:parseFloat($("#rcG").value)||0, l:parseFloat($("#rcL").value)||0, notes:$("#rcNotes").value});
    save1("recipes");
    closeModal("mdRecipe");
    renderRecipes();
  });
  openModal("mdRecipe");
}

/* ---------- COURSES ---------- */
function renderCourses(){
  var container = $("#sub-nutri-courses");
  var html = "<div class='card'><div class='row'><input type='text' id='courseNew' placeholder='Ajouter un article...' class='grow'><button class='btn' id='courseAdd'>+</button></div>"+
    "<div id='courseList' style='margin-top:10px'></div></div>";
  container.innerHTML = html;
  var listEl = $("#courseList");
  function draw(){
    listEl.innerHTML = S.courses.map(function(c,i){
      var right = "<span class='check-row-del' data-coursedel='"+i+"'>×</span>";
      var nameStyle = c.done ? "text-decoration:line-through;color:var(--text-dim)" : "";
      return checkRowHtml(c.name, c.done, "data-coursecheck='"+i+"'", right, nameStyle);
    }).join("") || "<div class='empty-state'>Liste vide.</div>";
    $all("[data-coursecheck]", listEl).forEach(function(row){
      row.addEventListener("click", function(e){
        if(e.target.closest("[data-coursedel]")) return;
        var i = parseInt(row.dataset.coursecheck);
        S.courses[i].done = !S.courses[i].done;
        save1("courses"); draw();
      });
    });
    $all("[data-coursedel]", listEl).forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        S.courses.splice(parseInt(b.dataset.coursedel),1); save1("courses"); draw();
      });
    });
  }
  draw();
  $("#courseAdd").addEventListener("click", function(){
    var v = $("#courseNew").value.trim();
    if(!v) return;
    S.courses.push({name:v, done:false});
    save1("courses");
    $("#courseNew").value="";
    draw();
  });
}

function renderMorphoSuivi(){
  var container = $("#sub-morpho-suivi");
  var last = S.weeklyData.length ? S.weeklyData[S.weeklyData.length-1] : null;

  var html = "<div class='morpho-top'>"+
    "<div class='morpho-silhouette-wrap'><img src='"+SILHOUETTE_DATAURI+"' alt='Silhouette'></div>"+
    "<div class='morpho-measures'>"+
    "<div class='row' style='justify-content:space-between;align-items:center;margin-bottom:10px'>"+
    "<div class='label' style='margin-bottom:0'>Mensurations"+(last?" — "+last.date:"")+"</div>"+
    "<button class='btn small' id='btnAddMeasure'>+ Mesures</button></div>";
  if(!last){
    html += "<div class='empty-state' style='padding:10px 0'>Aucune mesure enregistrée.</div>";
  } else {
    html += "<div class='row wrap' style='gap:14px 22px'>"+
      MORPHO_METRICS.map(function(m){
        return "<div><div class='label' style='margin-bottom:2px'>"+m.label+"</div><div class='band-val'>"+(last[m.key]!=null? last[m.key]+" "+m.unit : "—")+"</div></div>";
      }).join("")+
      "</div>";
  }
  html += "</div></div>";

  MORPHO_METRICS.forEach(function(m){
    html += "<div class='card'><div class='card-hd'><h3 style='font-size:15px'>"+m.label+" ("+m.unit+")</h3></div><canvas id='morphoCanvas_"+m.key+"' height='120'></canvas></div>";
  });
  container.innerHTML = html;
  MORPHO_METRICS.forEach(function(m){
    var values = S.weeklyData.map(function(w){ return w[m.key]!=null? w[m.key] : null; });
    charts.drawLine("morphoCanvas_"+m.key, values, "--em");
  });
  $("#btnAddMeasure").addEventListener("click", openMeasureModal);
}
function openMeasureModal(){
  var html = "<div class='modal-hd'><h2>Nouvelle mesure</h2><button class='modal-close' onclick=\"closeModal('mdMeasure')\">×</button></div>";
  html += "<label class='field'><div class='label'>Date</div><input type='date' id='msrDate' value='"+todayKey()+"'></label>";
  MORPHO_METRICS.forEach(function(m){
    html += "<label class='field'><div class='label'>"+m.label+" ("+m.unit+")</div><input type='number' step='0.1' id='msr_"+m.key+"'></label>";
  });
  html += "<button class='btn primary block' id='msrSave'>Enregistrer</button>";
  $("#mdMeasureBody").innerHTML = html;
  $("#msrSave").addEventListener("click", function(){
    var entry = {date:$("#msrDate").value};
    MORPHO_METRICS.forEach(function(m){ var v=parseFloat($("#msr_"+m.key).value); entry[m.key]= isNaN(v)?null:v; });
    S.weeklyData.push(entry);
    S.weeklyData.sort(function(a,b){ return a.date.localeCompare(b.date); });
    if(entry.weight) { S.weight = entry.weight; save1("weight"); }
    save1("weeklyData");
    closeModal("mdMeasure");
    renderMorphoSuivi();
    toast("Mesures enregistrées");
  });
  openModal("mdMeasure");
}

function renderMorphoAnalyse(){
  var container = $("#sub-morpho-analyse");
  var html = MORPHO_ANALYSIS_HTML;
  if(S.weeklyData.length>=2){
    var first = S.weeklyData[0], last = S.weeklyData[S.weeklyData.length-1];
    html += "<div class='card'><div class='card-hd'><h3>Évolution mesurée ("+first.date+" → "+last.date+")</h3></div>";
    MORPHO_METRICS.forEach(function(m){
      if(first[m.key]==null || last[m.key]==null) return;
      var delta = last[m.key]-first[m.key];
      var pct = first[m.key]!==0 ? (delta/first[m.key]*100).toFixed(1) : "0";
      var color = delta<0 ? "var(--em)" : (delta>0? "var(--go)" : "var(--text-mid)");
      html += "<div class='row' style='justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)'>"+
        "<span>"+m.label+"</span><span class='mono' style='color:"+color+"'>"+(delta>0?"+":"")+delta.toFixed(1)+" "+m.unit+" ("+(delta>0?"+":"")+pct+"%)</span></div>";
    });
    html += "</div>";
  } else {
    html += "<div class='empty-state'>Ajoute au moins deux mesures pour voir l'évolution chiffrée.</div>";
  }
  container.innerHTML = html;
}

SCIENCE_HTML.hyper = "<h3>Hypertrophie — Fessiers (Gluteus Maximus)</h3>"+
"<p>Le fessier suit les mêmes lois que tout muscle — surcharge progressive, volume, récupération, nutrition — avec des spécificités anatomiques. Une synthèse récente (11 études, 318 participants) confirme un effet net et solide de la musculation sur la croissance du grand fessier.</p>"+
"<h4>Anatomie</h4><p>Fibres supérieures (abduction/rotation externe) vs inférieures (extension de hanche). Squat et hip thrust ciblent surtout les fibres inférieures. Activation maximale en extension complète sous charge ET en position étirée profonde.</p>"+
"<h4>Exercices prioritaires</h4><ul><li><strong>Hip thrust barre</strong> — activation maximale en position haute.</li><li><strong>Squat complet</strong> — plus l'amplitude est grande, plus le fessier grossit.</li><li><strong>RDL</strong> — l'exercice étirement par excellence.</li><li><strong>Bulgarian split squat</strong> — unilatéral, forte tension en position étirée.</li><li><strong>Leg press 45°</strong>, pied haut — épaissit significativement le fessier.</li></ul>"+
"<h4>Règle des tiers (NSCA)</h4><p>Un tiers poussée horizontale (hip thrust), un tiers poussée verticale (squat/leg press), un tiers charnière de hanche (RDL/deadlift).</p>"+
"<h4>Paramètres</h4><ul><li>Volume : 12-20 séries/semaine, rendements décroissants au-delà de 20.</li><li>Répétitions : 6-12 reps zone de référence, 6-30 reps fonctionnent proche de l'échec.</li><li>Charge : 70-85% 1RM (compound), 50-70% (isolation).</li><li>Fréquence : 2-3x/semaine suffisant.</li><li>Amplitude : toujours maximale.</li></ul>"+
"<h4>Échec musculaire</h4><p>Non nécessaire pour maximiser hypertrophie ou force. RPE 7-9 suffit ; réservé à la dernière série d'isolation, déconseillé sur les mouvements lourds.</p>"+
"<h4>Mémoire musculaire</h4><p>Les noyaux musculaires acquis persistent après désentraînement, et des marqueurs épigénétiques préparent une reprise rapide. 10 semaines d'arrêt ne compromettent pas les acquis à volume équivalent — une pause de 2-3 semaines n'est pas préoccupante.</p>";

SCIENCE_HTML.tension = "<h3>Tension musculaire & hypertrophie en position étirée</h3>"+
"<p>La position dans laquelle un muscle travaille — étiré ou raccourci — influence où et comment il grossit.</p>"+
"<h4>Le mécanisme</h4><p>En position étirée sous charge, la tension active (contraction) s'ajoute à la tension passive, générée par l'étirement de la <strong>titine</strong>, la plus grande protéine du corps humain — un ressort moléculaire qui amplifierait le signal anabolique.</p>"+
"<h4>Ce que montrent les méta-analyses</h4><p>L'amplitude complète reste globalement supérieure à l'amplitude partielle. Mais les mouvements partiels en position étirée peuvent parfois faire mieux. Les preuves restent limitées et une méta-analyse bayésienne récente nuance l'effet sur l'hypertrophie régionale.</p>"+
"<h4>Inter-set stretch</h4><p>Étirer le muscle travaillé pendant le repos entre séries (20-30s, intensité 6-8/10). Effet probablement réel mais modeste, documenté notamment sur le soléaire.</p>"+
"<h4>Étirement passif prolongé</h4><p>Des séances de 30 minutes ou plus peuvent induire une hypertrophie mesurable, mais surtout chez les non-entraînés. La musculation reste supérieure chez qui s'entraîne déjà.</p>"+

SCIENCE_HTML.force = "<h3>Force — corps complet, haut du corps & différences hommes/femmes</h3>"+
"<p>Les femmes ont, proportionnellement, une meilleure marge de progression en force du haut du corps que les hommes — un résultat robuste qui doit orienter la programmation.</p>"+
"<h4>Ce que disent les données</h4><ul><li>Hypertrophie relative similaire entre sexes.</li><li>Force du haut du corps nettement supérieure chez les femmes en progression relative.</li><li>Force du bas du corps équivalente entre sexes.</li><li>Le cardio freine parfois la force du bas du corps chez les hommes, pas chez les femmes ; aucune interférence sur le haut du corps, peu importe le sexe.</li></ul>"+

  $all("[data-scitab]", subnav).forEach(function(b){
    b.addEventListener("click", function(){ drawScienceTab(b.dataset.scitab); });
  });
  drawScienceTab(CURRENT_SUB.science||"hyper");
}
function drawScienceTab(tabId){
  CURRENT_SUB.science = tabId;
  $all("[data-scitab]").forEach(function(b){ b.classList.toggle("active", b.dataset.scitab===tabId); });
  var body = $("#scienceBody");
  if(tabId==="glossaire") body.innerHTML = scienceGlossaryHtml();
  else if(tabId==="sources"){
    body.innerHTML = scienceSourcesHtml();
    $all("[data-acc]", body).forEach(function(item){
      item.querySelector(".accordion-hd").addEventListener("click", function(){ item.classList.toggle("open"); });
    });
  }
  else body.innerHTML = SCIENCE_HTML[tabId] || "<p>Contenu à venir.</p>";
}

/* =========================================================
   14. MODALE PROFIL — export/import/reset/backup
========================================================= */
function allDataObject(){
  var out = {};
  storage.allKeys().forEach(function(k){
    try{ out[k.slice(4)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
  });
  return out;
}
function renderProfileModal(){
  var html = "<div class='modal-hd'><h2>Profil & sauvegarde</h2><button class='modal-close' onclick=\"closeModal('mdProfile')\">×</button></div>";
  html += "<div class='card'><div class='band-title'>Cycle</div><div class='band-val'>Cycle "+S.cycleNum+" · Jour "+S.cycleDay+"/90</div>"+
    "<div class='row' style='margin-top:8px'><button class='btn small' id='btnResetCycleDay'>Réinitialiser au jour 1</button></div></div>";
  html += "<div class='card'><div class='band-title'>Dernière sauvegarde</div><div class='band-val'>"+(S.lastBackup? new Date(S.lastBackup).toLocaleString("fr-FR") : "Jamais")+"</div>"+
    "<div class='row wrap' style='margin-top:8px'>"+
    "<button class='btn primary' id='btnExportJson'>Exporter (JSON)</button>"+
    "<button class='btn' id='btnImportJsonTrigger'>Importer</button>"+
    "<input type='file' id='inpImportJson' accept='application/json' style='display:none'>"+
    "</div></div>";
  html += "<div class='card'><div class='band-title'>Google Drive</div><div class='band-val' style='font-size:12px;color:var(--text-mid)'>Sauvegarde cloud — nécessite de connecter ton compte Google (non configuré dans cette version).</div>"+
    "<button class='btn block' id='btnDriveBackup' style='margin-top:8px'>Sauvegarder sur Drive</button></div>";
  html += "<div class='card' style='border-color:#c0453f'><div class='band-title' style='color:#c0453f'>Zone danger</div>"+
    "<button class='btn danger block' id='btnEraseAll' style='margin-top:8px'>Effacer toutes les données</button></div>";
  $("#mdProfileBody").innerHTML = html;

  $("#btnResetCycleDay").addEventListener("click", function(){
    askConfirm("Réinitialiser le cycle", "Réinitialiser le cycle au jour 1 ?", function(){
      S.cycleDay=1; save1("cycleDay"); renderProfileModal(); renderHome();
    });
  });
  $("#btnExportJson").addEventListener("click", function(){
    var data = allDataObject();
    var blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "mini-monster-backup-"+todayKey()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    S.lastBackup = new Date().toISOString(); save1("lastBackup");
    renderProfileModal();
    toast("Sauvegarde exportée");
  });
  $("#btnImportJsonTrigger").addEventListener("click", function(){ $("#inpImportJson").click(); });
  $("#inpImportJson").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        askConfirm("Importer une sauvegarde", "Ceci va remplacer toutes les données locales actuelles. Continuer ?", function(){
          Object.keys(data).forEach(function(k){ storage.save(k, data[k]); });
          toast("Import réussi, rechargement...");
          setTimeout(function(){ location.reload(); }, 800);
        });
      }catch(err){ toast("Fichier invalide"); }
    };
    reader.readAsText(file);
  });
  $("#btnDriveBackup").addEventListener("click", function(){
    toast("Connexion Google Drive non configurée dans cette version — utilise l'export JSON en attendant.");
  });
  $("#btnEraseAll").addEventListener("click", function(){
    askConfirm("Effacer toutes les données", "Ceci efface DÉFINITIVEMENT toutes les données locales, action irréversible. Confirmer ?", function(){
      storage.allKeys().forEach(function(k){ localStorage.removeItem(k); });
      localStorage.removeItem("mm3_migrated");
      location.reload();
    });
  });
}
$("#btnProfile").addEventListener("click", function(){ renderProfileModal(); openModal("mdProfile"); });

function maybeShowBackupReminder(){
  if(!S.lastBackup){ setTimeout(function(){ toast("💾 Pense à exporter une sauvegarde depuis le bouton profil."); }, 2000); return; }
  var days = (Date.now()-new Date(S.lastBackup).getTime())/86400000;
  if(days>7){ setTimeout(function(){ toast("💾 Dernière sauvegarde il y a "+Math.floor(days)+" jours — pense à en refaire une."); }, 2000); }
}

/* =========================================================
   15. BOOT
========================================================= */
function updateHeader(){
  $("#hdrDate").textContent = fmtDateFR(effectiveNow());
  $("#hdrCycle").textContent = "C"+S.cycleNum+" · J"+S.cycleDay;
}
function bindLangSwitch(){
  $all("[data-lang]").forEach(function(b){
    b.classList.toggle("active", b.dataset.lang===S_lang);
    b.addEventListener("click", function(){ if(b.dataset.lang!==S_lang) setLang(b.dataset.lang); });
  });
}
function boot(){
  autoAdvanceCycleDay();
  updateHeader();
  applyI18nStatic();
  bindLangSwitch();
  nav.goTo("home");
  scheduleMidnightReload();
  maybeShowBackupReminder();
}
boot();

})();
</script>
